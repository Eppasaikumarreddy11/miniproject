
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conductor - Bus Pass Verification</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 600px; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
        h1 { text-align: center; color: #333; margin-bottom: 30px; }
        .scanner-section { text-align: center; margin-bottom: 20px; }
        #scanner { width: 100%; max-width: 400px; border-radius: 10px; }
        .status { margin: 10px 0; font-size: 18px; font-weight: bold; }
        .btn { padding: 15px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; transition: transform 0.3s; }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .qr-input { width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; margin: 10px 0; text-align: center; }
        .result { margin-top: 20px; padding: 20px; border-radius: 10px; display: none; }
        .result.valid { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
        .result.invalid { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
        .user-details { background: white; border-radius: 10px; padding: 20px; margin-top: 15px; }
        .detail-row { display: flex; justify-content: space-between; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .detail-label { font-weight: bold; color: #555; }
        .detail-value { color: #333; }
        #loading { text-align: center; padding: 50px; color: #666; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎫 Pass Verification</h1>
            <div class="scanner-section">
                <video id="scanner" autoplay playsinline style="display: none;"></video>
                <div id="status" class="status">Click Start Camera to scan QR</div>
                <button id="startBtn" class="btn" onclick="startScanner()">Start Camera</button>
                <button id="stopBtn" class="btn" onclick="stopScanner()" style="display: none;">Stop Camera</button>
            </div>
            <p style="text-align: center; color: #666; margin-bottom: 20px;">or paste QR data</p>
            <input type="text" id="qrData" class="qr-input" placeholder="QR data auto-fills from scan..." />
            <button class="btn" onclick="verifyQR()">Manual Verify</button>
            
            <div id="loading">Verifying...</div>
            <div id="result" class="result"></div>
        </div>
    </div>

    <script>

        let videoStream = null;
        let video = null;
        let canvas = null;
        let ctx = null;
        let scanning = false;
        let conductorToken = null;


        async function startScanner() {
            video = document.getElementById('scanner');
            video.style.display = 'block';
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';
            document.getElementById('status').textContent = '🔍 Scanning for QR...';
            
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                video.srcObject = videoStream;
                video.play();
                requestAnimationFrame(scanQR);
            } catch (err) {
                document.getElementById('status').textContent = 'Camera error: ' + err.message;
            }
        }

        function stopScanner() {
            scanning = false;
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            video.style.display = 'none';
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('status').textContent = 'Click Start Camera to scan QR';
        }

        function scanQR() {
            if (video.readyState !== video.HAVE_ENOUGH_DATA) {
                requestAnimationFrame(scanQR);
                return;
            }

            canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);
            
            if (code) {
                document.getElementById('qrData').value = code.data;
                document.getElementById('status').textContent = '✅ QR found! Auto-verifying...';
                verifyQR();
                stopScanner();
                return;
            }

            if (scanning) requestAnimationFrame(scanQR);
        }

        async function verifyQR() {
            const qrData = document.getElementById('qrData').value.trim();
            if (!qrData) return document.getElementById('status').textContent = 'No QR data';

            const loadingEl = document.getElementById('loading');
            const resultEl = document.getElementById('result');
            loadingEl.style.display = 'block';
            resultEl.style.display = 'none';

            try {
                const response = await fetch('http://127.0.0.1:5000/api/pass/verify-qr', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ qrData })
                });

                const data = await response.json();
                loadingEl.style.display = 'none';

                if (data.valid) {
                    resultEl.className = 'result valid';
                    resultEl.innerHTML = `
                        <h3>✅ Pass VALID</h3>
                        <p>Passenger authorized to board</p>
                        <div class="user-details">
                            <div class="detail-row"><span class="detail-label">Name:</span><span class="detail-value">${data.user.firstName} ${data.user.lastName}</span></div>
                            <div class="detail-row"><span class="detail-label">Aadhar:</span><span class="detail-value">${data.user.aadhar}</span></div>
                            <div class="detail-row"><span class="detail-label">Pass Type:</span><span class="detail-value">${data.pass.userType}</span></div>
                            <div class="detail-row"><span class="detail-label">Expires:</span><span class="detail-value">${new Date(data.pass.validUntil).toLocaleDateString()}</span></div>
                            <div class="detail-row"><span class="detail-label">Biometrics:</span><span class="detail-value">Face from Aadhaar Verified</span></div>
                        </div>
                    `;
                } else {
                    resultEl.className = 'result invalid';
                    resultEl.innerHTML = `<h3>❌ Invalid Pass</h3><p>${data.error || 'Unknown error'}</p>`;
                }
            } catch (err) {
                loadingEl.style.display = 'none';
                resultEl.className = 'result invalid';
                resultEl.innerHTML = `<h3>❌ Network Error</h3><p>Backend at localhost:5000?</p>`;
            }
            resultEl.style.display = 'block';
        }
    </script>
</body>
</html>
